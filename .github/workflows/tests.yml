name: Source and evidence checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce.py
      - run: python scripts/check_release.py
      - run: python scripts/check_anonymity.py --history
      # This is a source/statistics job; it does not claim a fresh simulation run.
      # No Pages deployment or release upload is configured.
