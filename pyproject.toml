[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scana-r"
version = "0.1.0"
description = "Calibrated action perturbations and verified simulation recovery data"
requires-python = ">=3.10,<3.11"
license = "Apache-2.0"
dependencies = ["numpy==2.2.6", "torch==2.7.1", "pandas==2.3.3", "scipy==1.15.3", "h5py==3.15.1", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
